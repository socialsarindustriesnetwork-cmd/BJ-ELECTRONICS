name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Commit resolved lockfile when changed
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve monorepo dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Type-check store and admin
        run: npm run typecheck

      - name: Lint store and admin
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log

      - name: Build store and admin
        id: build
        continue-on-error: true
        env:
          NEXT_PUBLIC_STORE_URL: https://www.bjelectronics.shop
          NEXT_PUBLIC_ADMIN_URL: https://admin.bjelectronics.shop
          NEXT_PUBLIC_APP_URL: https://admin.bjelectronics.shop
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build 2>&1 | tee build.log

      - name: Upload diagnostics on failure
        if: steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-quality-diagnostics
          path: |
            lint.log
            build.log

      - name: Enforce quality gate
        if: steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
