name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      NEXT_PUBLIC_STORE_URL: https://www.bjelectronics.shop
      NEXT_PUBLIC_ADMIN_URL: https://admin.bjelectronics.shop
      NEXT_PUBLIC_APP_URL: https://admin.bjelectronics.shop
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/bj_electronics_ci
      DB_POOL_MAX: 10
      DB_SSL: true
      DB_SSL_REJECT_UNAUTHORIZED: true
      REALTIME_POLL_INTERVAL_MS: 1500
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      ALLOW_PUBLIC_SIGNUP: false
      ADMIN_BOOTSTRAP_EMAILS: owner@bjelectronics.shop
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit platform configuration and deployment invariants
        run: npm run audit

      - name: Validate immutable migration set
        run: npm run db:validate

      - name: Validate store production environment contract
        run: npm run validate:store

      - name: Validate admin production environment contract
        run: npm run validate:admin

      - name: Type-check store and admin
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Lint store and admin
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log

      - name: Build store and admin
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Upload diagnostics on failure
        if: steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: platform-quality-diagnostics
          path: |
            typecheck.log
            lint.log
            build.log

      - name: Enforce quality gate
        if: steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
