name: Hostinger Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      STORE_URL: ${{ vars.HOSTINGER_STORE_URL }}
      ADMIN_URL: ${{ vars.HOSTINGER_ADMIN_URL }}
      STORE_DEPLOY_WEBHOOK_URL: ${{ secrets.HOSTINGER_STORE_DEPLOY_WEBHOOK_URL }}
      ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.HOSTINGER_ADMIN_DEPLOY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger optional store deployment webhook
        run: |
          if [ -n "$STORE_DEPLOY_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "content-type: application/json" \
              --data "{\"application\":\"store\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"main\",\"sha\":\"${GITHUB_SHA}\"}" \
              "$STORE_DEPLOY_WEBHOOK_URL"
          else
            echo "No store webhook configured; relying on Hostinger Git auto-deploy."
          fi

      - name: Trigger optional admin deployment webhook
        run: |
          if [ -n "$ADMIN_DEPLOY_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "content-type: application/json" \
              --data "{\"application\":\"admin\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"main\",\"sha\":\"${GITHUB_SHA}\"}" \
              "$ADMIN_DEPLOY_WEBHOOK_URL"
          else
            echo "No admin webhook configured; relying on Hostinger Git auto-deploy."
          fi

      - name: Verify store and admin production deployments
        run: |
          if [ -z "$STORE_URL" ] || [ -z "$ADMIN_URL" ]; then
            echo "HOSTINGER_STORE_URL and HOSTINGER_ADMIN_URL must both be configured to run smoke tests."
            exit 0
          fi
          node scripts/check-production.mjs "$STORE_URL" "$ADMIN_URL"
